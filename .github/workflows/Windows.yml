name: Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg and install dependencies
        shell: bash
        run: |
          if [ ! -f "C:/vcpkg/vcpkg.exe" ]; then
            git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
            C:/vcpkg/bootstrap-vcpkg.bat
          fi
          # ogg/vorbis/png/jpeg + curl с ssh (libssh2) и openssh
          C:/vcpkg/vcpkg install libogg:x64-windows libvorbis:x64-windows libpng:x64-windows libjpeg-turbo:x64-windows curl[ssh]:x64-windows openssh:x64-windows
          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV

      - name: Run dependencies script
        shell: bash
        run: |
          cd Windows
          chmod +x Start.sh
          export CMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          ./Start.sh

      - name: Build with CMake
        shell: bash
        run: |
          cmake --build . -j

      - name: Upload all EXE files
        uses: actions/upload-artifact@v4
        with:
          path: '**/*.exe'
          if-no-files-found: warn
